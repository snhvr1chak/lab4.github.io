<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4.github.io</title>
    <style>
        /* Базові налаштування фону та шрифту */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9; /* М'який світло-сірий фон сторінки */
            color: #333;
            display: flex;
            align-items: center; /* Центрування по вертикалі */
            justify-content: center; /* Центрування по горизонталі */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Контейнер-картка для контенту */
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px; /* Закруглені кути картки */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* Легка тінь */
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Стилі для заголовка */
        h1 {
            color: #2c3e50;
            font-size: 2.2em;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #f0f0f5;
            padding-bottom: 15px;
        }

        /* Стилі для тексту */
        p {
            font-size: 1.15em;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        /* Стилі для картинки */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px; /* Закруглені кути картинки */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); /* Тінь для картинки */
            transition: transform 0.3s ease; /* Плавна анімація */
        }

        /* Ефект збільшення при наведенні мишкою на картинку */
        img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>lab4.github.io</h1>
        <p>Ubiquitous website to finally complete the lab4 task after a month of procrastinating :(</p>
        
        <img src="2026-05-03 00.13.44.jpg" alt="I have a question fox">
    </div>

</body>
</html>
