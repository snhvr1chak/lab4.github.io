<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4.github.io</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2d1100;
            font-size: 3.2em;
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 15px;
        }

        p {
            font-size: 1.15em;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>lab4.github.io</h1>
        <p>Ubiquitous website to finally complete the lab4 task after a month of procrastinating :(</p>
        
        <img src="2026-05-03 00.13.44.jpg" alt="I have a question fox">
    </div>

</body>
</html>
